plugins {
    id "com.android.application"
}

// Release versioning: the v* tag is the single source of truth, shared by local
// and CI builds. versionName comes from -PversionName=X.Y.Z when supplied,
// else the nearest vX.Y.Z git tag (so CI needs full tag history — see
// android-release.yml fetch-depth). versionCode packs the semver as
// major*1_000_000 + minor*1_000 + patch, so any later tag outranks every
// earlier build (and the legacy hardcoded versionCode 1). A build that cannot
// derive a valid version fails loudly instead of stamping a wrong version.
def releaseVersion = {
    def name = providers.gradleProperty('versionName').orElse('').get()
    if (!name) {
        try {
            def out = new ByteArrayOutputStream()
            project.exec {
                commandLine 'git', 'describe', '--tags', '--abbrev=0'
                standardOutput = out
                ignoreExitValue = true
            }
            name = out.toString().trim()
        } catch (Exception ignored) {
            // no git on PATH — handled by the loud failure below
        }
    }
    def m = name =~ /^v?(\d+)\.(\d+)\.(\d+)$/
    if (!m) throw new GradleException(
        "Cannot derive release version from '${name}' — tag as vX.Y.Z or pass -PversionName=X.Y.Z")
    def (major, minor, patch) = [m[0][1], m[0][2], m[0][3]]*.toInteger()
    if ([major, minor, patch].any { it > 999 }) throw new GradleException(
        "Version '${name}' has a component > 999; versionCode packing would not stay monotonic")
    [name: "$major.$minor.$patch", code: major * 1_000_000 + minor * 1_000 + patch]
}()

android {
    namespace "dev.clipshelf.app"
    compileSdk 35

    defaultConfig {
        applicationId "dev.clipshelf.app"
        minSdk 26
        targetSdk 35
        versionCode releaseVersion.code
        versionName releaseVersion.name
    }

    signingConfigs {
        release {
            // Release signing material comes ONLY from protected env/secret paths.
            // Absent env = loud build failure; debug signing never substitutes for release.
            def ksPath = System.getenv("CLIPSHELF_RELEASE_KEYSTORE")
            def ksStorePass = System.getenv("CLIPSHELF_RELEASE_STORE_PASSWORD")
            def ksAlias = System.getenv("CLIPSHELF_RELEASE_KEY_ALIAS")
            def ksKeyPass = System.getenv("CLIPSHELF_RELEASE_KEY_PASSWORD")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword ksStorePass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            // No applicationIdSuffix: the share target identity is dev.clipshelf.app.
        }
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
        unitTests.all {
            // Robolectric fetches android-all at test runtime over its own HTTP
            // stack, which fails on some CI egress (SSL handshake). Resolve the
            // artifact through Gradle instead and hand the test JVM a seeded
            // Maven-layout dir, so tests never touch the network.
            it.dependsOn seedRobolectricRepo
            it.systemProperty "robolectric.dependency.dir",
                    layout.buildDirectory.dir("robolectric-all").get().asFile.absolutePath
            it.testLogging {
                exceptionFormat "full"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// One configuration per version: Gradle version-conflict resolution would
// otherwise collapse the two android-all modules to the highest version and
// silently drop the other SDK's jar.
def robolectricAllIds = ["14-robolectric-10818077-i7", "15-robolectric-12650502-i7"]
configurations {
    robolectricAllIds.each { id -> create("robolectricSeed$id") }
}
dependencies {
    robolectricAllIds.each { id ->
        add("robolectricSeed$id", "org.robolectric:android-all-instrumented:$id")
    }
}

def robolectricDir = layout.buildDirectory.dir("robolectric-all")

tasks.register("seedRobolectricRepo", Copy) {
    robolectricAllIds.each { id -> from(configurations.getByName("robolectricSeed$id")) }
    into robolectricDir
    doLast {
        def dir = robolectricDir.get().asFile
        def missing = robolectricAllIds.findAll {
            !new File(dir, "android-all-instrumented-${it}.jar").isFile()
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Robolectric seed incomplete in ${dir}: missing ${missing}")
        }
    }
}

dependencies {
    implementation "androidx.work:work-runtime:2.9.1"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
    // Real org.json for the JVM: android.jar ships a stub that throws
    // "not mocked" under local unit tests. Test classpath only — never
    // packaged into the APK, so the release license gate is unaffected.
    testImplementation "org.json:json:20240303"
}
