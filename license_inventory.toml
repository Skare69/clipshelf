# Third-party license inventory and allowlist (review 2026-10-02).
#
# Ground truth sources:
#   python  : importlib.metadata of the exact `pip install -r requirements.txt`
#             resolution (the image installs exactly this set; CPython 3.13,
#             linux). `observed` is the review-time version snapshot, NOT a
#             gate — pip owns version resolution; this file gates the NAME SET
#             and the LICENSE of every shipped distribution.
#   android : `gradlew :app:dependencies --configuration releaseRuntimeClasspath`
#             (versions here are resolved pins and ARE gate-checked exactly).
#   image   : Dockerfile pins (base, apt lines, bundled SQLite).
#
# Enforced by check_licenses.py in ci.yml (python job: python+image modes,
# android job: android mode). A new dependency — pip line, gradle line, apt
# install (any form), external image via COPY --from / RUN --mount=from=, or new
# transitive — fails the build until it is reviewed and added here and to
# THIRD_PARTY_NOTICES.md. Package-manager use the gate cannot parse also fails.

[allow]
# SPDX identifiers permitted for shipped third-party code.
# GPL-2.0-only is allowed ONLY for separate executables the server invokes as
# subprocesses (gallery-dl, Debian ffmpeg) — never import/link GPL code into
# the MIT application. Any new copyleft entry needs operator review.
ids = [
    "MIT", "MIT-0", "MIT-CMU", "BSD-3-Clause", "Apache-2.0",
    "PSF-2.0", "MPL-2.0", "ZPL-2.1", "Unlicense",
    "GPL-2.0-only",
    "LicenseRef-Public-Domain",
]

# Tooling excluded from the shipped-set check: never application dependencies.
tooling = ["pip", "setuptools", "wheel"]

