[image]
# Distro-level policy: Debian packages (base image + apt lines) are covered as
# a set — Debian guarantees DFSG-free licenses and ships the exact license
# text for every package inside the image at /usr/share/doc/<pkg>/copyright,
# with sources on deb.debian.org. The gate checks the pins below, not each
# package's license.
base = "python:3.13-slim@sha256:bb2988715db2cf7ace7b53f38f3cffbef7c7046a656bee66245eb0ed386e2e81"
# Multistage build: the compiler set lives in the discarded sqlite-build stage;
# only the runtime set ships.
apt_build_stage = ["ca-certificates", "gcc", "libc6-dev", "make"]
apt_runtime = ["ca-certificates", "ffmpeg"]

[image.sqlite]
version = "3.53.1"
tarball = "sqlite-autoconf-3530100.tar.gz"
url = "https://sqlite.org/2026/sqlite-autoconf-3530100.tar.gz"
sha256 = "83e6b2020a034e9a7ad4a72feea59e1ad52f162e09cbd26735a3ffb98359fc4f"
license = "LicenseRef-Public-Domain"
