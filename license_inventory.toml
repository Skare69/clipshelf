# Third-party license inventory and allowlist (review 2026-10-02).
#
# Ground truth sources:
#   python  : importlib.metadata of the hash-locked install
#             `pip install --require-hashes -r requirements.lock` (CI and the
#             image install exactly this set; CPython 3.13, linux). `observed`
#             is gate-checked against the installed (locked) version — every
#             lock bump must update it here and the row in
#             THIRD_PARTY_NOTICES.md (`scripts/lock_deps.py check` keeps the
#             lock in step with requirements.txt); this file gates the NAME
#             SET, the VERSION and the LICENSE of every shipped distribution.
#   android : `gradlew :app:dependencies --configuration releaseRuntimeClasspath`
#             (versions here are resolved pins and ARE gate-checked exactly).
#   image   : Dockerfile pins (base, apt lines, bundled SQLite), read from the
#             Dockerfile text, not from a built image.
#
# Enforced by check_licenses.py in ci.yml (python job: the default run,
# android job: android mode). Every python and android entry must also have a
# matching row (name, version, license) in THIRD_PARTY_NOTICES.md. A new
# dependency — pip line, gradle line, apt install (any form), external image
# via COPY --from / RUN --mount=from=, or new transitive — fails the build
# until it is reviewed and added here and to THIRD_PARTY_NOTICES.md.
# Package-manager use the gate cannot parse also fails.

[allow]
# SPDX identifiers permitted for shipped third-party code.
# GPL-2.0-only is allowed ONLY for separate executables the server invokes as
# subprocesses (gallery-dl, Debian ffmpeg) — never import/link GPL code into
# the MIT application. Any new copyleft entry needs operator review.
ids = [
    "MIT", "MIT-0", "MIT-CMU", "BSD-3-Clause", "Apache-2.0",
    "PSF-2.0", "MPL-2.0", "ZPL-2.1", "Unlicense",
    "GPL-2.0-only",
    "LicenseRef-Public-Domain",
]

# Tooling excluded from the shipped-set check: never application dependencies.
tooling = ["pip", "setuptools", "wheel"]

# Licenses permitted for bundled font files only (operator approval
# 2026-10-13). Fonts are data, not code: these never join `ids`.
fonts = ["OFL-1.1"]

