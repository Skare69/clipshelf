name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    # Migrated server checks: dependency install, Django system check, migration
    # against a throwaway data dir, and the unittest suite (repo root plus the
    # clipshelf package). Runs outside the NAS; nothing is published.
    runs-on: ubuntu-latest
    env:
      CLIPSHELF_DATA_DIR: /tmp/clipshelf-data
      CLIPSHELF_DEBUG: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      # Hash-locked install: CI tests and audits exactly the resolution the
      # published image ships (requirements.lock covers the full closure).
      - run: pip install --require-hashes -r requirements.lock
      - name: Fail when requirements.txt drifts from the lock
        run: python scripts/lock_deps.py check
      # License gate runs on the exact shipped set, before any tooling
      # (ruff/pip-audit) pollutes the env. See license_inventory.toml.
      - run: python check_licenses.py
      # Lint + dependency-audit gates before the Django steps. ruff.toml scopes
      # the lint to the clipshelf package; the DJ rules are built into ruff.
      - run: pip install ruff==0.16.9 pip-audit==2.10.1
      - run: ruff check
      # --no-deps: audit the pinned set itself, not a fresh re-resolution.
      - run: pip-audit -r requirements.lock --no-deps
      - run: python clipshelf.py check
      - run: python clipshelf.py migrate
      - run: python clipshelf.py test --verbosity 1
      - run: python test_clipshelf.py
      - run: python test_sources.py

  android:
    # Debug-build gate for the Android client. Versions are stamped from the
    # nearest v* tag (android/app/build.gradle releaseVersion rule), so the
    # checkout needs full tag history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          validate-wrappers: true
      - run: mkdir -p app/build && ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon -q
          > app/build/license-deps.txt
        working-directory: android
      - run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: android
      # After assembleDebug so the gate can also assert the APK packs the notices.
      - run: python3 check_licenses.py android --deps android/app/build/license-deps.txt --apk android/app/build/outputs/apk/debug/app-debug.apk
      # JVM gates for outbox persistence and drain invariants (Robolectric).
      - run: ./gradlew :app:testDebugUnitTest --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: unit-test-results
          path: android/app/build/test-results/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clipshelf-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
