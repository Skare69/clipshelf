name: PR title
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Require Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Dependabot titles are "Bump x from y to z" and fit no allowed type,
          # so the exact bot account stays exempt from this check.
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            exit 0
          fi
          if ! printf '%s\n' "$TITLE" | grep -Eq '^(feat|fix|refactor|docs|test): [a-zA-Z]'; then
            echo "::error::PR title must follow the project commit rules: feat|fix|refactor|docs|test, then ': title', lowercase, no scope (e.g. 'feat: add arm64 workers'). Got: $TITLE"
            exit 1
          fi
