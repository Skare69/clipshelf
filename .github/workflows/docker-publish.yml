name: docker-publish

# Builds and publishes a versioned image to GHCR. Manual dispatch or v* tag
# push only — never ordinary pushes, never executed by the agent. The image is
# built and verified outside the NAS (TrueNAS consumes the published tag).
# Requires a token with write:packages (workflow GITHUB_TOKEN provides it).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numeric image version, e.g. 1.0.0"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (amd64) for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: clipshelf:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify in-image SQLite runtime (fixed WAL build, not the tag)
        run: |
          docker run --rm -e CLIPSHELF_DATA_DIR=/tmp/vdata --entrypoint python clipshelf:verify deploy/check_sqlite.py
      - name: Verify Django boot path (production mode, no configuration)
        run: |
          docker run --rm -e CLIPSHELF_DATA_DIR=/tmp/vdata clipshelf:verify check
      - name: Entrypoint rejects unknown ops (no shell passthrough)
        run: |
          if docker run --rm -e CLIPSHELF_DATA_DIR=/tmp/vdata -e CLIPSHELF_DEBUG=1 clipshelf:verify definitely-not-an-op; then
            echo "::error::entrypoint accepted an unknown operation"; exit 1
          fi
          echo "ok: unknown op rejected"
      - name: Verify default serve, startup migrations, and healthcheck
        # Finding G8: never verified the default CMD `serve` end to end. Start
        # it exactly as operators do (no command, no debug env), against a
        # throwaway data dir inside the container — no host volume, nothing
        # pre-existing is touched or deleted. On a fresh dir, /healthz answering
        # ok+database proves startup migrations applied (get_settings needs the
        # migrated schema). The probe is deploy/healthcheck.py, the same script
        # compose.yaml wires as the container healthcheck. Teardown is a normal
        # graceful `docker stop` (SIGTERM) of the throwaway container.
        run: |
          docker run -d --rm --name clipshelf-verify-serve \
            -e CLIPSHELF_DATA_DIR=/tmp/vdata clipshelf:verify
          trap 'docker stop clipshelf-verify-serve' EXIT
          healthy=""
          for _ in $(seq 1 30); do
            if docker exec clipshelf-verify-serve python deploy/healthcheck.py; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ -z "$healthy" ]; then
            docker logs clipshelf-verify-serve
            echo "::error::default serve never answered /healthz (bounded 60s poll)"
            exit 1
          fi
          echo "ok: /healthz ok+database on a fresh data dir (startup migrations applied)"
          docker logs clipshelf-verify-serve 2>&1 | grep -F 'clipshelf on http://' \
            || { echo "::error::serve banner missing — waitress did not bind after migrations"; exit 1; }
          echo "ok: default serve bound 0.0.0.0:8000 and healthy"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve versioned tags
        id: ver
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          v="${VERSION_INPUT:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid version '$v' (need exactly three numeric components like 1.0.0)"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          image="$(printf '%s' 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          major="${v%%.*}"; minor="${v#*.}"; minor="${minor%%.*}"
          {
            echo "tags<<TAGS"
            echo "${image}:${v}"
            echo "${image}:${major}.${minor}"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ver.outputs.tags }}
          build-args: |
            IMAGE_VERSION=${{ steps.ver.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
