name: android-release

# Builds the signed release APK. Manual dispatch or v* tag push only.
# Release signing secrets are REQUIRED: the job fails loudly when any is
# missing — the gate is never silently skipped. The keystore exists only at
# ~/clipshelf-release.jks (outside the workdir) and is never uploaded.
# The build job (Gradle runs third-party plugins and dependencies) holds only a
# read token, not persisted in .git/config; the attach job gets contents: write
# and runs no repo code.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Publishing gate: ci.yml only runs on main pushes and PRs, so a v* tag never
  # triggered it — a tag on a red or still-running commit published anyway
  # (v0.10.0 release-review finding). Fail closed: hold until the tagged
  # commit's ci.yml run (license, lock, audit and test gates, python+android)
  # finishes green; any other conclusion, a gh api error, or a 90-minute wait
  # fails the job. Needs only the Actions API, no checkout.
  wait-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require a green ci.yml run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          url="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=1"
          for i in $(seq 1 90); do
            info=$(gh api "$url" \
              --jq '.workflow_runs[0] | if . then "\(.status) \(.conclusion // "")" else "" end')
            case "$info" in
              "completed success")
                echo "ok: ci.yml green on $GITHUB_SHA"; exit 0 ;;
              "completed "*)
                echo "::error::ci.yml on $GITHUB_SHA: $info"; exit 1 ;;
              "")
                echo "no ci.yml run for $GITHUB_SHA yet ($i/90)" ;;
              *)
                echo "ci.yml on $GITHUB_SHA still $info ($i/90)" ;;
            esac
            sleep 60
          done
          echo "::error::no green ci.yml run for $GITHUB_SHA within 90 minutes"; exit 1

  signed-apk:
    # Same gate as attach-apk: never build with the production key on a tag
    # whose ci.yml run failed or is still running.
    needs: [wait-ci]
    runs-on: ubuntu-latest
    env:
      CLIPSHELF_RELEASE_KEYSTORE_BASE64: ${{ secrets.CLIPSHELF_RELEASE_KEYSTORE_BASE64 }}
      CLIPSHELF_RELEASE_STORE_PASSWORD: ${{ secrets.CLIPSHELF_RELEASE_STORE_PASSWORD }}
      CLIPSHELF_RELEASE_KEY_ALIAS: ${{ secrets.CLIPSHELF_RELEASE_KEY_ALIAS }}
      CLIPSHELF_RELEASE_KEY_PASSWORD: ${{ secrets.CLIPSHELF_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Require signing secrets
        run: |
          missing=0
          for name in CLIPSHELF_RELEASE_KEYSTORE_BASE64 CLIPSHELF_RELEASE_STORE_PASSWORD \
                      CLIPSHELF_RELEASE_KEY_ALIAS CLIPSHELF_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::missing repository secret ${name} (required for release signing)"
              missing=1
            fi
          done
          exit "$missing"
      # Full history so :app:assembleRelease can stamp versionName/versionCode
      # from the nearest v* tag (android/app/build.gradle releaseVersion rule).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore keystore outside the repo
        run: |
          echo "$CLIPSHELF_RELEASE_KEYSTORE_BASE64" | base64 -d > "$HOME/clipshelf-release.jks"
          echo "CLIPSHELF_RELEASE_KEYSTORE=$HOME/clipshelf-release.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          validate-wrappers: true
      - run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clipshelf-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # Attach the signed APK to the GitHub release for this tag. Ottr's
  # release flow pushes the tag, then creates the release only after the
  # docker image publishes (v0.9.0 took ~19 minutes tag-to-release), so
  # the upload waits up to 40 minutes for it and fails loudly if it
  # never shows. A workflow_dispatch build has no release and skips this.
  # ponytail: fixed 40-min window; raise the seq bound if the Ottr flow
  # ever gets slower.
  attach-apk:
    needs: [signed-apk, wait-ci]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Job-level permissions replace (not extend) the workflow defaults.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: clipshelf-release-apk
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          apk=app-release.apk
          for i in $(seq 1 160); do
            if gh release upload "$GITHUB_REF_NAME" "$apk" --clobber; then
              echo "attached $apk to $GITHUB_REF_NAME"
              exit 0
            fi
            [ "$i" = 1 ] && echo "release $GITHUB_REF_NAME not up yet; retrying"
            sleep 15
          done
          echo "::error::release $GITHUB_REF_NAME did not appear for the APK upload"
          exit 1
