# Dependabot version updates: one entry per ecosystem with a tracked manifest.
#   github-actions -> .github/workflows/*.yml
#   pip            -> requirements.txt
#   docker         -> Dockerfile
#   gradle         -> android/build.gradle, android/app/build.gradle
# compose.yaml has no pinned third-party image, so it needs no docker-compose entry.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix

  - package-ecosystem: gradle
    directories:
      - /android
      - /android/app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
