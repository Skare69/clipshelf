name: Bug report
description: A problem in the web UI, the Android app, the worker or the container
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A security problem does not go here.
        Report it through private vulnerability reporting.
        See [SECURITY.md](https://github.com/Skare69/clipshelf/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The problem, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you shared, and the capture kind (TikTok post, video, or page).
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      options:
        - Web UI
        - Android app
        - Worker
        - Container or deploy
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or container tag, and your browser or Android version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        An excerpt of the worker or server log helps.
        Trim personal data first. Captured links and entry text are private data.
